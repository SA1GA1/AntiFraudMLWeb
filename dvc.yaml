# DVC pipeline for the daily retrain.
#
# Stages mirror trainer/cli.py subcommands. `dvc repro` skips a stage when its
# inputs haven't changed, which makes daily reruns cheap: only `aggregate` and
# `train` typically need to re-execute, `extract` only if labels grew.
#
# `events_glob`, `labels_glob`, and `label_window_end` come from params.yaml
# (overridable per-environment without editing this file).

stages:
  aggregate:
    cmd: >-
      python -m trainer.cli aggregate
      --events-glob "${events_glob}"
      --incremental
      --state-path ${state_path}
      --input ${data_dir}
      --work-dir ${work_dir}
    deps:
      - trainer/aggregate.py
      - trainer/cli.py
    params:
      - events_glob
      - state_path
      - data_dir
      - work_dir
    outs:
      - ${work_dir}/customer_features.parquet
      - ${state_path}

  extract:
    cmd: >-
      python -m trainer.cli extract
      --events-glob "${events_glob}"
      --labels-glob "${labels_glob}"
      --label-window-end "${label_window_end}"
      --input ${data_dir}
      --work-dir ${work_dir}
      --append
    deps:
      - trainer/extract.py
      - trainer/cli.py
    params:
      - events_glob
      - labels_glob
      - label_window_end
      - data_dir
      - work_dir
    outs:
      - ${work_dir}/labelled_events.parquet

  train:
    cmd: >-
      python -m trainer.cli train
      --input ${data_dir}
      --work-dir ${work_dir}
      --out ${output_dir}
      --epochs ${epochs}
      --mlflow-uri "${mlflow_uri}"
      --mlflow-experiment ${mlflow_experiment}
      --registered-model-name ${model_name}
    deps:
      - trainer/train.py
      - trainer/model.py
      - trainer/preprocess.py
      - trainer/dataset.py
      - trainer/pyfunc.py
      - trainer/cli.py
      - ${work_dir}/customer_features.parquet
      - ${work_dir}/labelled_events.parquet
    params:
      - epochs
      - mlflow_uri
      - mlflow_experiment
      - model_name
      - output_dir
      - data_dir
      - work_dir
    outs:
      - ${output_dir}/best.pt
    metrics:
      - ${output_dir}/metrics.json:
          cache: false
